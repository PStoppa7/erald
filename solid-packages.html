<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid Packages — Blue Feather Courier</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-feather"></i>
                <span>Blue Feather Courier</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="index.html#services" class="nav-link">Services</a></li>
                <li><a href="service-request.html" class="nav-link">Request Service</a></li>
                <li><a href="index.html#about" class="nav-link">About</a></li>
                <li><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero" style="min-height: 60vh; padding-top: 120px;">
        <div class="hero-content">
            <h1>Solid Package Shipping</h1>
            <p>Secure transportation for solid goods with comprehensive tracking and careful handling to protect fragile and high‑value items.</p>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </section>

    <section class="services" style="padding: 3rem 0;">
        <div class="container">
            <div class="calculation-container">
                <h2 style="text-align: center; margin-bottom: 2rem; color: #1e293b;">
                    <i class="fas fa-box"></i> Solid Package Calculator
                </h2>
                <form class="calculation-form" id="solidCalculator">
                    <div class="form-group">
                        <label for="packageType">Package Type</label>
                        <select id="packageType" required>
                            <option value="">Select package type</option>
                            <option value="standard">Standard Package</option>
                            <option value="fragile">Fragile Items</option>
                            <option value="heavy">Heavy Machinery</option>
                            <option value="electronics">Electronics</option>
                            <option value="furniture">Furniture</option>
                            <option value="automotive">Automotive Parts</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" min="0.1" step="0.1" required placeholder="Enter weight in kg">
                    </div>

                </form>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
